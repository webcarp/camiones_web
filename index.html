<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="favicon.png" />
  <title>Camiones</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f0f0f0;
    }
    h1 {
      text-align: center;
      font-size: 24px;
      margin-bottom: 20px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }
    .card {
      background: white;
      padding: 12px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .card button {
      width: 100%;
      height: 100px;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card img {
      max-width: 120px;
      height: auto;
    }
    .counter {
      margin-top: 10px;
      font-weight: bold;
      font-size: 18px;
      color: black;
    }
    .highlight {
      color: red;
    }
  </style>
</head>
<body>
  <h1>Marcas de Camiones</h1>
  <div class="grid">
    <div class="card"><button onclick="incrementCounter(0)"><img src="logos/volvo.png" alt="Volvo"></button><div class="counter" id="counter0">0</div></div>
    <div class="card"><button onclick="incrementCounter(1)"><img src="logos/iveco.png" alt="Iveco"></button><div class="counter" id="counter1">0</div></div>
    <div class="card"><button onclick="incrementCounter(2)"><img src="logos/daf.png" alt="DAF"></button><div class="counter" id="counter2">0</div></div>
    <div class="card"><button onclick="incrementCounter(3)"><img src="logos/mercedes.png" alt="Mercedes"></button><div class="counter" id="counter3">0</div></div>
    <div class="card"><button onclick="incrementCounter(4)"><img src="logos/man.png" alt="MAN"></button><div class="counter" id="counter4">0</div></div>
    <div class="card"><button onclick="incrementCounter(5)"><img src="logos/renault.png" alt="Renault"></button><div class="counter" id="counter5">0</div></div>
    <div class="card"><button onclick="incrementCounter(6)"><img src="logos/scania.png" alt="Scania"></button><div class="counter" id="counter6">0</div></div>
    <div class="card"><button onclick="incrementCounter(7)"><img src="logos/ford.png" alt="Ford"></button><div class="counter" id="counter7">0</div></div>
  </div>
  <script>
    const counters = Array(8).fill(0);

    function incrementCounter(index) {
      counters[index]++;
      updateCounters();
    }

    function updateCounters() {
      const max = Math.max(...counters);
      counters.forEach((count, i) => {
        const el = document.getElementById('counter' + i);
        el.innerText = count;
        el.classList.toggle('highlight', count === max && max > 0);
      });
    }
  </script>
</body>
</html>
