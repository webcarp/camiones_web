<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="favicon.png" />
  <title>Camiones</title>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f0f0f0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    h1 {
      text-align: center;
      font-size: 24px;
      margin-bottom: 20px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      flex-grow: 1;
    }
    .card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card button {
      flex: 1;
      border: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px;
      background: white;
      transition: box-shadow 0.3s ease, background-color 0.3s ease;
    }
    .card button.clicked {
      box-shadow: 0 0 12px 4px rgba(0, 128, 255, 0.6);
      background-color: #e6f3ff;
    }
    .card img {
      max-width: 70%;
      height: auto;
      pointer-events: none;
    }
    .counter-bar {
      background: #003366;
      color: white;
      text-align: center;
      padding: 8px 0;
      font-weight: bold;
      font-size: 18px;
      transition: background-color 0.3s;
    }
    .counter-bar.highlight {
      background: #cc0000;
    }
    .footer {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
      gap: 10px;
    }
    .footer button {
      flex: 1;
      padding: 14px;
      font-size: 16px;
      border: none;
      border-radius: 12px;
      background-color: #007aff;
      color: white;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .footer button:hover {
      background-color: #005bb5;
    }
  </style>
</head>
<body>
  <h1>Marcas de Camiones</h1>

  <div class="grid" id="grid">
    <div class="card">
      <button onclick="incrementCounter(0, this)">
        <img src="logos/volvo.png" alt="Volvo">
      </button>
      <div class="counter-bar" id="counter0">0</div>
    </div>
    <div class="card">
      <button onclick="incrementCounter(1, this)">
        <img src="logos/iveco.png" alt="Iveco">
      </button>
      <div class="counter-bar" id="counter1">0</div>
    </div>
    <div class="card">
      <button onclick="incrementCounter(2, this)">
        <img src="logos/daf.png" alt="DAF">
      </button>
      <div class="counter-bar" id="counter2">0</div>
    </div>
    <div class="card">
      <button onclick="incrementCounter(3, this)">
        <img src="logos/mercedes.png" alt="Mercedes">
      </button>
      <div class="counter-bar" id="counter3">0</div>
    </div>
    <div class="card">
      <button onclick="incrementCounter(4, this)">
        <img src="logos/man.png" alt="MAN">
      </button>
      <div class="counter-bar" id="counter4">0</div>
    </div>
    <div class="card">
      <button onclick="incrementCounter(5, this)">
        <img src="logos/renault.png" alt="Renault">
      </button>
      <div class="counter-bar" id="counter5">0</div>
    </div>
    <div class="card">
      <button onclick="incrementCounter(6, this)">
        <img src="logos/scania.png" alt="Scania">
      </button>
      <div class="counter-bar" id="counter6">0</div>
    </div>
    <div class="card">
      <button onclick="incrementCounter(7, this)">
        <img src="logos/ford.png" alt="Ford">
      </button>
      <div class="counter-bar" id="counter7">0</div>
    </div>
  </div>

  <div class="footer">
    <button onclick="takeScreenshot()">📸 Captura</button>
    <button onclick="resetCounters()">🔄 Reset</button>
  </div>

  <script>
    const counters = Array(8).fill(0);

    function incrementCounter(index, buttonElement) {
      counters[index]++;
      updateCounters();
      buttonElement.classList.add("clicked");
      setTimeout(() => buttonElement.classList.remove("clicked"), 600);
    }

    function updateCounters() {
      const max = Math.max(...counters);
      counters.forEach((count, i) => {
        const el = document.getElementById('counter' + i);
        el.innerText = count;
        if (count === max && max > 0) {
          el.classList.add('highlight');
        } else {
          el.classList.remove('highlight');
        }
      });
    }

    function resetCounters() {
      counters.fill(0);
      updateCounters();
    }

    function takeScreenshot() {
      html2canvas(document.body).then(canvas => {
        const link = document.createElement('a');
        link.download = 'camiones.png';
        link.href = canvas.toDataURL();
        link.click();
      });
    }

    updateCounters();
  </script>
</body>
</html>
